spring.application.name=ss8-homework

#cau hình datasoure
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=postgres
spring.datasource.password=123456

#Cau hình hibernate
#Hibernate có th? t? t?o/c?p nh?t table t??ng ?ng trong database.
spring.jpa.hibernate.ddl-auto=update
#Cho phép Hibernate in SQL mà nó th?c thi ra console.
spring.jpa.show-sql=true
#format SQL khi in ra
spring.jpa.properties.hibernate.format_sql=true
#Cho bi?t ?ang s? d?ng DB nào
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Khi Java dùng camelCase phía DB t? nh?n di?n sang d?ng snake_case mà k làm ??i tên bi?n Java
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

